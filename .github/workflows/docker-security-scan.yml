name: Docker Security Scan

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "backend/**"
      - "frontend/**"
      - "trivy-ignore.yaml"
      - ".github/workflows/docker-security-scan.yml"
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  scan-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Trivy scans a locally loaded image — multi-platform push is not
      # needed here. We build amd64 only so --load works (buildx cannot
      # --load a multi-platform image into the local daemon).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          tags: stellarkraal-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run Trivy vulnerability scanner (CRITICAL/HIGH — fail build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellarkraal-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: trivy-ignore.yaml

      - name: Run Trivy vulnerability scanner (SARIF upload)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellarkraal-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          trivyignores: trivy-ignore.yaml

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-backend-results.sarif') != ''
        with:
          sarif_file: trivy-backend-results.sarif
          category: backend-image

      - name: Upload Trivy scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-results
          path: trivy-backend-results.sarif
          retention-days: 30

  scan-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image for scanning (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          push: false
          tags: stellarkraal-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy vulnerability scanner (CRITICAL/HIGH — fail build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellarkraal-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: trivy-ignore.yaml

      - name: Run Trivy vulnerability scanner (SARIF upload)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellarkraal-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          trivyignores: trivy-ignore.yaml

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-frontend-results.sarif') != ''
        with:
          sarif_file: trivy-frontend-results.sarif
          category: frontend-image

      - name: Upload Trivy scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-results
          path: trivy-frontend-results.sarif
          retention-days: 30
